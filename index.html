<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Банк покупок — Калык шынык</title>
    <style>
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f4f8f3; }
      .boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #1f2a1f;
      }
      .boot__card {
        max-width: 560px;
        background: #fff;
        border: 1px solid #d8e3d8;
        border-radius: 12px;
        padding: 16px 20px;
      }
      code { background: #f3f6f3; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot__card">Загрузка приложения…</div>
      </div>
    </div>

    <script type="module">
      const root = document.getElementById("root");

      if (window.location.protocol === "file:") {
        root.innerHTML = `
          <div class="boot">
            <div class="boot__card">
              <h1 style="margin:0 0 8px;">Приложение не может стартовать из файла</h1>
              <p style="margin:0 0 8px;">Запусти проект через Vite dev-server:</p>
              <p style="margin:0;"><code>npm install</code> → <code>npm run dev</code></p>
            </div>
          </div>
        `;
      } else {
        import("/src/main.jsx");
      }
    </script>
  </body>
</html>
